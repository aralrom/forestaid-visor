<!DOCTYPE html>

<link rel="stylesheet" href="lib/leaflet.css">
<style>
html, body { height: 100%; margin: 0; font-family: -apple-system, "Segoe UI", Arial, sans-serif; }
#mapa { position: absolute; top: 64px; bottom: 0; left: 0; right: 0; background: #f7f6f2; }
#cabecera {
  position: absolute; top: 0; left: 0; right: 0; height: 64px; z-index: 1000;
  background: #ffffff; border-bottom: 1px solid #d8d6cc; display: flex;
  align-items: center; padding: 0 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}

}

}
#panel-rejilla .contenedor-img {
  min-height: 100%; display: flex; align-items: center; justify-content: center;

}

}

  position: absolute; top: 64px; bottom: 0; left: 0; right: 0; background: #efeee8;
  overflow: auto; display: none; padding: 20px; box-sizing: border-box;
}

  display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px; max-width: 1400px; margin: 0 auto;
}
.mosaico-item { cursor: zoom-in; background: white; border-radius: 6px; overflow: hidden;
  box-shadow: 0 1px 6px rgba(0,0,0,0.15); transition: transform 0.12s ease; }
.mosaico-item:hover { transform: translateY(-2px); box-shadow: 0 3px 10px rgba(0,0,0,0.22); }

}

#lightbox {
  position: fixed; inset: 0; background: rgba(20,20,18,0.88); z-index: 2000;
  display: none; align-items: center; justify-content: center; flex-direction: column;

}
#lightbox.abierto { display: flex; }
#lightbox img { max-width: 92vw; max-height: 84vh; box-shadow: 0 4px 24px rgba(0,0,0,0.5); }
#lightbox .lightbox-fecha { color: #f2f1ea; font-size: 14px; margin-top: 10px; font-weight: 600; }
#lightbox .lightbox-cerrar {
  position: absolute; top: 18px; right: 26px; color: #f2f1ea; font-size: 28px; cursor: pointer;
  line-height: 1; font-family: Arial, sans-serif;
}
.leyenda-caja {
  background: white; padding: 10px 14px; border-radius: 6px; box-shadow: 0 1px 6px rgba(0,0,0,0.25);
  font-size: 12.5px; color: #2a2a28; line-height: 1.55; max-width: 260px;
}
.leyenda-caja h3 { margin: 0 0 6px 0; font-size: 12.5px; }
.leyenda-sub { margin: 8px 0 4px 0; font-weight: 600; border-top: 1px solid #e5e3d8; padding-top: 6px; }
.leyenda-fila { display: flex; align-items: center; gap: 6px; }
.leyenda-color { width: 14px; height: 14px; border-radius: 2px; display: inline-block; flex: none; }
.leyenda-circulo {
  width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none;
  border-style: solid; border-color: #4a4a4a; background: transparent; box-sizing: content-box;
}
.leyenda-niebla-secuencia { flex-wrap: wrap; gap: 3px 5px; row-gap: 4px; }
.leyenda-niebla-valor { font-size: 10.5px; color: #7a7972; margin-right: 2px; }
.leyenda-niebla-flecha { font-size: 10px; color: #b5b3a8; }
.leyenda-niebla-nota { font-size: 10px; color: #9a988d; font-style: italic; margin: 2px 0 4px 0; line-height: 1.3; }
.leaflet-popup-content { font-size: 12.5px; line-height: 1.5; }
.leaflet-popup-content b { font-size: 13px; }
.leaflet-popup-content details { margin-top: 6px; border-top: 1px solid #e5e3d8; padding-top: 5px; }
.leaflet-popup-content summary {
  cursor: pointer; font-size: 11.5px; color: #7a5a2a; font-weight: 600; outline: none;
}
.leaflet-popup-content .popup-nota {
  font-size: 10.5px; color: #7a7972; font-style: italic; margin: 5px 0 7px 0; line-height: 1.35;
}
.leaflet-popup-content .popup-grupo { font-size: 11.5px; margin-bottom: 5px; line-height: 1.45; }
.leaflet-popup-content .popup-grupo b { font-size: 11.5px; color: #4a4a45; }
</style>
</head>
<body>
<div id="cabecera">
  <h1>Susceptibilidad de incendio por municipio — 2026-09-29</h1>
  <span class="sub">Modelo K2 · p90 de p_mean por término municipal (856 incendios de entrenamiento)</span>
  <div class="tabs">
    <button class="tab-btn" id="btn-municipal" onclick="mostrarVista('municipal')">Vista municipal</button>
    <button class="tab-btn" id="btn-rejilla" onclick="mostrarVista('rejilla')">Rejilla 1km</button>
    <button class="tab-btn" id="btn-historico" onclick="mostrarVista('historico')">Histórico</button>
  </div>
</div>
<div id="mapa"></div>
<div id="panel-rejilla">
  <div class="contenedor-img">
    <img id="img-rejilla" src="mapas/susceptibilidad_k2_20260929.png"
         alt="Mapa de susceptibilidad, rejilla 1km, 2026-09-29"
         onclick="this.classList.toggle('zoom')">
  </div>
  <div class="aviso-zoom">Clic en la imagen para ampliar / reducir</div>
</div>
<div id="panel-historico">
  <div class="mosaico-historico" id="mosaico-historico"></div>
  <div class="enlace-archivo"><a href="archivo.html">Ver todos los mapas publicados →</a></div>
</div>
<div id="lightbox" onclick="cerrarLightbox()">
  <span class="lightbox-cerrar" onclick="cerrarLightbox()">&times;</span>
  <img id="lightbox-img" src="" alt="">
  <div class="lightbox-fecha" id="lightbox-fecha"></div>
</div>
<script src="lib/leaflet.js"></script>
<script src="datos/municipios_geom.js"></script>
<script src="datos/valores_k2_20260929.js"></script>
<script>
// Geometría (fija) y valores (del día) viajan en ficheros separados en
// modo web; aquí se vuelven a unir en el GeoJSON que espera el resto.
const datos = {type: 'FeatureCollection', features: window.VALORES_MUNICIPIOS.map(
  (p) => ({type: 'Feature', properties: p, geometry: window.GEOM_MUNICIPIOS[p.CODIMUNI]}))};

// zoomSnap/zoomDelta a 0.25 (en vez del entero por defecto): cada clic de +/- o
// cada paso de rueda avanza solo un cuarto de nivel de zoom, en vez de un nivel
// completo -- zoom más gradual, a petición de la autora.
const mapa = L.map('mapa', {zoomControl: true, zoomSnap: 0.25, zoomDelta: 0.25})
  .setView([41.75, 1.6], 8);
mapa.attributionControl.setPrefix(false);

// Capa base de OpenStreetMap. Las teselas se sirven remotas: no engordan el
// HTML autocontenido. Opacidad 0.55 para que los polígonos municipales, que
// van con fillOpacity 0.85, sigan siendo legibles por encima. No lleva aquí
// la opción `attribution`: el crédito de OSM ya viene dentro de
// "Elaboración propia a partir de: precipitación observada de la red XEMA, Servei Meteorològic de Catalunya (datos actualizados a 29/09/2026) · previsión meteorológica ICON-EU, Deutscher Wetterdienst (DWD) · ERA5-Land (Copernicus Climate Change Service) y CEMS Fire Historical (Copernicus Emergency Management Service), <a href='https://creativecommons.org/licenses/by/4.0/'>CC BY 4.0</a> · perímetros históricos de incendios forestales, Departament d'Agricultura, Ramaderia, Pesca i Alimentació, Generalitat de Catalunya, <a href='https://web.gencat.cat/ca/generalitat/dades-indicadors/dades-obertes/llicencies'>Llicència oberta d'ús d'informació — Catalunya</a> · &copy; <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a> contributors" (construir_texto_creditos(..., incluye_capa_base=True)),
// que es la fuente única del pie -- declararlo también en la capa lo
// duplicaría en el control de atribución.
// Leaflet coloca las teselas en el `tilePane` y el GeoJSON en el
// `overlayPane`, que va por encima: el orden queda garantizado por Leaflet,
// no por el orden de estas líneas.
//
// Abierto en local (file://) el navegador no envía cabecera Referer, y la
// política de uso de tile.openstreetmap.org la exige: cada tesela llega
// sustituida por un cartel "403 Access blocked" (comprobado con curl, sesión
// 2026-09-10; con cualquier Referer http(s), incluido localhost, sirve la
// tesela normal). En ese caso se piden al servidor de OSM France con el
// estilo HOT: mismos datos de OSM, nombres en la lengua local y sin exigir
// Referer. CARTO se descartó (sin Referer devuelve marca de agua "API KEY
// REQUIRED") y el estilo `osmfr` también (rotula en francés). Publicado en
// GitHub Pages sigue usando el servidor estándar de OSM.
const abiertoEnLocal = window.location.protocol === 'file:';
L.tileLayer(abiertoEnLocal
    ? 'https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png'
    : 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  subdomains: 'abc',
  maxZoom: 19,
  opacity: 0.55
}).addTo(mapa);
// El crédito de los datos (© OpenStreetMap contributors) ya va en el pie de
// créditos común y vale para los dos servidores; el de quien dibuja y sirve
// las teselas solo aplica en local y se añade más abajo, al final de ese pie.
const creditoTeselasLocal = abiertoEnLocal
  ? ' · Teselas: estilo <a href="https://www.hotosm.org/">HOT</a>, servidas por ' +
    '<a href="https://www.openstreetmap.fr/">OSM France</a>'
  : '';

// Créditos de fuentes (obligación de licencia XEMA/DWD/Copernicus/Generalitat
// y ODbL de OSM, ver construir_texto_creditos() en
// 53_generar_mapa_susceptibilidad.py -- texto generado allí, NO duplicado
// aquí, para que no diverja del pie del PNG de rejilla). Control de
// atribución de Leaflet: es donde se espera encontrarlo.
mapa.attributionControl.addAttribution("Elaboración propia a partir de: precipitación observada de la red XEMA, Servei Meteorològic de Catalunya (datos actualizados a 29/09/2026) · previsión meteorológica ICON-EU, Deutscher Wetterdienst (DWD) · ERA5-Land (Copernicus Climate Change Service) y CEMS Fire Historical (Copernicus Emergency Management Service), <a href='https://creativecommons.org/licenses/by/4.0/'>CC BY 4.0</a> · perímetros históricos de incendios forestales, Departament d'Agricultura, Ramaderia, Pesca i Alimentació, Generalitat de Catalunya, <a href='https://web.gencat.cat/ca/generalitat/dades-indicadors/dades-obertes/llicencies'>Llicència oberta d'ús d'informació — Catalunya</a> · &copy; <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a> contributors" + creditoTeselasLocal);

// El popup de un municipio incluye un <details> plegable (condiciones de la
// celda determinante). Leaflet solo hace autoPan UNA VEZ, al abrir el popup
// -con el <details> todavia cerrado y el popup pequeño-. Si se despliega
// despues, el popup crece y puede salirse de la pantalla sin que Leaflet lo
// note (a peticion de la autora, sesion 2026-08-22: "se leen mal, salen de
// la pantalla"). `maxHeight` en bindPopup ya acota el crecimiento (con
// scroll interno si hace falta).
//
// NO usar `popup.update()` aqui -primer intento, revertido-: relee el HTML
// original que se paso a bindPopup() y lo vuelve a meter en el popup, lo que
// CIERRA el <details> que el usuario acaba de abrir (parpadeo + hace falta
// un segundo clic para verlo, confirmado en vivo el 22/08). El ajuste de
// abajo solo mueve el mapa (`panBy`, API publica, no toca el contenido del
// popup) lo justo para que el popup entero quepa en la ventana.
mapa.on('popupopen', function(e) {
  const el = e.popup.getElement();
  if (!el) return;
  const detalles = el.querySelector('details');
  if (!detalles) return;
  detalles.addEventListener('toggle', function() {
    requestAnimationFrame(function() {
      const MARGEN = 12;
      const rectPopup = el.getBoundingClientRect();
      const rectMapa = mapa.getContainer().getBoundingClientRect();
      let dx = 0, dy = 0;
      if (rectPopup.top < rectMapa.top + MARGEN) dy = rectPopup.top - (rectMapa.top + MARGEN);
      if (rectPopup.bottom > rectMapa.bottom - MARGEN) dy = rectPopup.bottom - (rectMapa.bottom - MARGEN);
      if (rectPopup.left < rectMapa.left + MARGEN) dx = rectPopup.left - (rectMapa.left + MARGEN);
      if (rectPopup.right > rectMapa.right - MARGEN) dx = rectPopup.right - (rectMapa.right - MARGEN);
      if (dx !== 0 || dy !== 0) { mapa.panBy([dx, dy], {animate: true}); }
    });
  });
});

function estiloMunicipio(feature) {
  return {
    fillColor: feature.properties.color,
    weight: 0.6,
    color: "#5c5b54",
    fillOpacity: 0.85,
  };
}

function fmt(v, dec) {
  if (v === null || v === undefined || Number.isNaN(v)) return "—";
  return v.toFixed(dec).replace(".", ",");
}

// Unidades de las covariables tal como se muestran (celda_precip_5d ya llega
// en mm desde agregar_susceptibilidad_municipal.py, no en metros -- ver
// FACTOR_MM_A_M_PRECIP_5D en ese script). Debe coincidir con
// UNIDADES_COVARIABLES del lado Python.
const UNIDADES = {
  fwi: "", t2m_max: "°C", rh: "%", wind_speed: " m/s",
  precip_5d: " mm", swvl1_anom: "", ndvi: "",
  pendiente_deg: "°", radiacion: " kWh/m²/año",
};

function celda(p, nombre, dec) {
  const v = p["celda_" + nombre];
  return fmt(v, dec) + (UNIDADES[nombre] ?? "");
}

function popupMunicipioHTML(p) {
  const nivel = p.n_celdas === 0 ? "Sin celdas en la rejilla" : (p.quintil_label || "—");
  let html = `
    <b>${p.NOMMUNI}</b><br>
    Nivel: ${nivel}<br>
    p_mean (p90): ${fmt(p.p_mean_p90, 3)} &nbsp;·&nbsp; p_sd (p90): ${fmt(p.p_sd_celda, 4)}<br>
    Celdas de rejilla: ${p.n_celdas ?? 0} &nbsp;·&nbsp; Fuera de rango: ${fmt(p.pct_fuera_rango, 1)}%
  `;
  if (p.n_celdas > 0 && p.celda_fwi !== null && p.celda_fwi !== undefined) {
    html += `
      <details>
        <summary>Condiciones de la celda determinante del p90</summary>
        <div class="popup-nota">Valores de la ÚNICA celda de 1&nbsp;km cuyo p_mean fija el
        percentil 90 de este municipio — no son medias municipales.</div>
        <div class="popup-grupo"><b>Meteorología</b><br>
          FWI ${celda(p, "fwi", 1)} · Temp. máx. ${celda(p, "t2m_max", 1)} ·
          HR ${celda(p, "rh", 1)} · Viento ${celda(p, "wind_speed", 2)}
        </div>
        <div class="popup-grupo"><b>Agua y vegetación</b><br>
          Precip. 5d ${celda(p, "precip_5d", 2)} · NDVI ${celda(p, "ndvi", 3)}<br>
          Anomalía humedad suelo ${celda(p, "swvl1_anom", 3)}
        </div>
        <div class="popup-grupo"><b>Terreno</b><br>
          Pendiente ${celda(p, "pendiente_deg", 1)} · Radiación ${celda(p, "radiacion", 0)}
        </div>
      </details>
    `;
  }
  return html;
}

function onEachMunicipio(feature, layer) {
  layer.bindPopup(popupMunicipioHTML(feature.properties), {maxWidth: 300, maxHeight: 320, autoPanPadding: [20, 20]});
  layer.on({
    mouseover: (e) => e.target.setStyle({weight: 2, color: "#222"}),
    mouseout: (e) => e.target.setStyle({weight: 0.6, color: "#5c5b54"}),
  });
}

const capa = L.geoJSON(datos, {style: estiloMunicipio, onEachFeature: onEachMunicipio}).addTo(mapa);
mapa.fitBounds(capa.getBounds(), {padding: [10, 10]});

const leyenda = L.control({position: 'bottomright'});
leyenda.onAdd = function() {
  const div = L.DomUtil.create('div', 'leyenda-caja');
  div.innerHTML = `<h3>Susceptibilidad municipal (p90)</h3><div class="leyenda-fila"><span class="leyenda-color" style="background:#fef0d9"></span>Q1 — 409 municipios (43.2%)</div>
<div class="leyenda-fila"><span class="leyenda-color" style="background:#fdd49e"></span>Q2 — 252 municipios (26.6%)</div>
<div class="leyenda-fila"><span class="leyenda-color" style="background:#fdbb84"></span>Q3 — 166 municipios (17.5%)</div>
<div class="leyenda-fila"><span class="leyenda-color" style="background:#fc8d59"></span>Q4 — 101 municipios (10.7%)</div>
<div class="leyenda-fila"><span class="leyenda-color" style="background:#b30000"></span>Q5 — 19 municipios (2.0%)</div>
<div class="leyenda-fila"><span class="leyenda-color" style="background:#9a9a9a"></span>Fuera de rango — 0 municipios (0.0%)</div>
<div class="leyenda-sub">Niebla — incertidumbre (p_sd, celda determinante del p90) — grosor continuo, sin techo</div>
<div class="leyenda-niebla-nota">Tamaños de ejemplo sobre una escala continua sin límite superior (ref. de pendiente: rejilla 15-18/08/2026).</div>
<div class="leyenda-fila leyenda-niebla-secuencia"><span class="leyenda-circulo" style="border-width:0.50px"></span><span class="leyenda-niebla-valor">0.014</span><span class="leyenda-niebla-flecha">→</span><span class="leyenda-circulo" style="border-width:2.00px"></span><span class="leyenda-niebla-valor">0.070</span><span class="leyenda-niebla-flecha">→</span><span class="leyenda-circulo" style="border-width:3.50px"></span><span class="leyenda-niebla-valor">0.125</span><span class="leyenda-niebla-flecha">→</span><span class="leyenda-circulo" style="border-width:6.50px"></span><span class="leyenda-niebla-valor">0.237</span></div>`;
  return div;
};
leyenda.addTo(mapa);

// --- Niebla (incertidumbre, p_sd_celda -- la SD de la MISMA celda
// determinante del p90, no la media municipal, para ser coherente con
// p_mean_p90 y con las covariables del popup): círculos huecos en el
// centroide, grosor de línea continuo por p_sd -- NO el radio (a diferencia
// del ráster de 53, que codifica en radio). Aquí el color/relleno de cada
// municipio ya es la variable principal y no debe perder legibilidad por
// debajo de una niebla de opacidad; codificar en el grosor del trazo dice
// "más SD = trazo más grueso" sin tapar ni aclarar el color.
//
// SIN TOPE SUPERIOR (decisión de la autora, 2026-08-23, ver PESO_MIN_NIEBLA en
// construir_leyenda_html() del lado Python -- misma justificación, no repetida
// aquí): antes el grosor saturaba a PESO_MAX_NIEBLA=3.5px en NIEBLA_P95_REJILLA
// y perdía toda capacidad de distinguir la cola extrema. Se probó una pendiente
// fija (10px por unidad de p_sd) para eliminar el techo, pero comprimía
// demasiado el 90-95% "normal" de municipios (0,6-1,2px, apenas distinguible) --
// revertido. La escala ahora es la ORIGINAL anclada a percentiles
// (PESO_MIN_NIEBLA en NIEBLA_P5_REJILLA, PESO_MAX_NIEBLA en NIEBLA_P95_REJILLA,
// esa pendiente sí diferencia bien el rango normal) pero SIN el `Math.min` que
// recortaba por arriba -- la misma pendiente sigue más allá de p95 sin límite,
// aceptando que un p_sd muy alto convierta el círculo en un disco casi sólido:
// el objetivo es que la variación se siga viendo en la cola, no conservar la
// forma de anillo. Valores literales (no __TOKEN__) porque no dependen de la
// fecha/modelo de esta ejecución.
const NIEBLA_P5_REJILLA = 0.0137, NIEBLA_P95_REJILLA = 0.1254;
const PESO_MIN_NIEBLA = 0.5, PESO_MAX_NIEBLA = 3.5;
const RADIO_NIEBLA = 4;

function pesoNiebla(sd) {
  const score = Math.max((sd - NIEBLA_P5_REJILLA) / (NIEBLA_P95_REJILLA - NIEBLA_P5_REJILLA), 0);
  return PESO_MIN_NIEBLA + score * (PESO_MAX_NIEBLA - PESO_MIN_NIEBLA);
}

const capaNiebla = L.layerGroup();
datos.features.forEach((feature) => {
  const p = feature.properties;
  if (!p.n_celdas || p.p_sd_celda === null || p.p_sd_celda === undefined) return;
  const circulo = L.circleMarker([p.cy, p.cx], {
    radius: RADIO_NIEBLA,
    weight: pesoNiebla(p.p_sd_celda),
    color: "#4a4a4a",
    fillOpacity: 0,
    opacity: 0.85,
  });
  circulo.bindPopup(popupMunicipioHTML(p), {maxWidth: 300, maxHeight: 320, autoPanPadding: [20, 20]});
  circulo.addTo(capaNiebla);
});
capaNiebla.addTo(mapa);  // visible por defecto, con casilla para ocultarla

const controlCapas = L.control.layers(null, {"Niebla (incertidumbre, p_sd)": capaNiebla}, {collapsed: false, position: 'topright'});
controlCapas.addTo(mapa);

function mostrarVista(vista) {
  document.getElementById('mapa').style.display = vista === 'municipal' ? 'block' : 'none';
  document.getElementById('panel-rejilla').style.display = vista === 'rejilla' ? 'block' : 'none';
  document.getElementById('panel-historico').style.display = vista === 'historico' ? 'block' : 'none';
  document.getElementById('btn-municipal').classList.toggle('activa', vista === 'municipal');
  document.getElementById('btn-rejilla').classList.toggle('activa', vista === 'rejilla');
  document.getElementById('btn-historico').classList.toggle('activa', vista === 'historico');
  // Leaflet no calcula bien su tamaño mientras el contenedor está oculto
  // (display:none) -- al volver a la vista municipal hay que decírselo.
  if (vista === 'municipal') { setTimeout(() => mapa.invalidateSize(), 50); }
}
mostrarVista('municipal');

// --- Histórico: mosaico de los últimos N mapas + lightbox al hacer clic ---
// (a petición de la autora, sesión 2026-08-22). `historico` viene de Python
// ya en orden "más reciente primero"; `src_thumb`/`src_full` son data URI en
// base64 en el HTML autocontenido y rutas relativas a mapas/ en modo web.
const historico = [{"fecha": "2026-09-29", "src_thumb": "mapas/miniaturas/susceptibilidad_k2_20260929.png", "src_full": "mapas/susceptibilidad_k2_20260929.png"}, {"fecha": "2026-09-28", "src_thumb": "mapas/miniaturas/susceptibilidad_k2_20260928.png", "src_full": "mapas/susceptibilidad_k2_20260928.png"}, {"fecha": "2026-09-27", "src_thumb": "mapas/miniaturas/susceptibilidad_k2_20260927.png", "src_full": "mapas/susceptibilidad_k2_20260927.png"}, {"fecha": "2026-09-26", "src_thumb": "mapas/miniaturas/susceptibilidad_k2_20260926.png", "src_full": "mapas/susceptibilidad_k2_20260926.png"}, {"fecha": "2026-09-25", "src_thumb": "mapas/miniaturas/susceptibilidad_k2_20260925.png", "src_full": "mapas/susceptibilidad_k2_20260925.png"}, {"fecha": "2026-09-24", "src_thumb": "mapas/miniaturas/susceptibilidad_k2_20260924.png", "src_full": "mapas/susceptibilidad_k2_20260924.png"}, {"fecha": "2026-09-23", "src_thumb": "mapas/miniaturas/susceptibilidad_k2_20260923.png", "src_full": "mapas/susceptibilidad_k2_20260923.png"}, {"fecha": "2026-09-22", "src_thumb": "mapas/miniaturas/susceptibilidad_k2_20260922.png", "src_full": "mapas/susceptibilidad_k2_20260922.png"}, {"fecha": "2026-09-21", "src_thumb": "mapas/miniaturas/susceptibilidad_k2_20260921.png", "src_full": "mapas/susceptibilidad_k2_20260921.png"}, {"fecha": "2026-09-20", "src_thumb": "mapas/miniaturas/susceptibilidad_k2_20260920.png", "src_full": "mapas/susceptibilidad_k2_20260920.png"}];

function fechaLegible(iso) {
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
}

function construirMosaicoHistorico() {
  const cont = document.getElementById('mosaico-historico');
  if (!historico.length) {
    cont.innerHTML = '<div class="mosaico-vacio">No hay mapas históricos disponibles todavía.</div>';
    return;
  }
  cont.innerHTML = historico.map((h, i) => `
    <div class="mosaico-item" onclick="abrirLightbox(${i})">
      <img src="${h.src_thumb}" alt="Mapa de susceptibilidad, ${h.fecha}" loading="lazy">
      <div class="mosaico-fecha">${fechaLegible(h.fecha)}${h.fecha === "2026-09-29" ? " (hoy)" : ""}</div>
    </div>
  `).join("");
}
construirMosaicoHistorico();

function abrirLightbox(indice) {
  const h = historico[indice];
  document.getElementById('lightbox-img').src = h.src_full;
  document.getElementById('lightbox-fecha').textContent = fechaLegible(h.fecha);
  document.getElementById('lightbox').classList.add('abierto');
}
function cerrarLightbox() {
  document.getElementById('lightbox').classList.remove('abierto');
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') cerrarLightbox(); });
</script>
